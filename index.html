<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="apple-touch-icon" href="studybody computer">  
<title>学习助手</title>
<style>
*{box-sizing:border-box}
:root{
--bg:#000;--bg2:#0f0f0f;--card:#141414;--border:#262626;
--text:#f6f6f6;--muted:#a3a3a3;--faint:#737373;
--line2:#3a3a3a;--gray:#1a1a1a;--white:#fafafa;
}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:linear-gradient(180deg,#000 0%,#0a0a0a 100%);background-attachment:fixed;color:var(--text);font-family:"Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;font-size:16px;line-height:1.6}
h1{font-size:22px;margin:0 0 6px}
h2{font-size:19px;margin:0 0 8px}
h3{font-size:16px;margin:12px 0 6px}
p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.hidden{display:none!important}
button{font-family:inherit}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 22px;min-height:48px;font-size:16px;font-weight:600;color:#0a0a0a;background:var(--white);border:1px solid var(--white);border-radius:12px;cursor:pointer;transition:opacity .15s,transform .05s;text-decoration:none}
.btn:hover{opacity:.85}
.btn:active{transform:scale(.97)}
.btn:disabled{background:var(--gray);border-color:var(--border);color:#525252;cursor:not-allowed;opacity:1}
.btn-ghost{background:transparent;color:var(--text);border:1px solid #525252}
.btn-green{background:var(--white);border-color:var(--white);color:#0a0a0a}
.btn-red{background:var(--gray);border-color:var(--border);color:#d4d4d4}
.btn-yellow{background:var(--white);border-color:var(--white);color:#0a0a0a}
.btn-sm{min-height:36px;padding:8px 14px;font-size:14px;border-radius:9px}
.btn-row{display:flex;flex-wrap:wrap;gap:10px;margin:12px 0}
#nav{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:rgba(0,0,0,.96);border-bottom:1px solid var(--border)}
#nav button{flex:1 1 80px;padding:11px 6px;font-size:15px;font-weight:600;color:var(--muted);background:transparent;border:1px solid transparent;border-radius:10px;cursor:pointer}
#nav button.active{color:#0a0a0a;background:var(--white)}
main{max-width:860px;margin:0 auto;padding:14px 14px 90px}
.sec{display:none}
.sec.active{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:16px;margin:12px 0}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 12px;border-radius:999px;font-size:13px;font-weight:700;background:var(--gray);border:1px solid var(--line2);color:#d4d4d4;vertical-align:middle}
.badge.green,.badge.on{background:var(--white);border-color:var(--white);color:#0a0a0a}
.badge.gray{background:var(--gray);color:var(--muted)}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;margin:10px 0;background:var(--card);border:1px solid var(--border);border-left:5px solid var(--border);border-radius:16px;flex-wrap:wrap}
.item.now{border-left-color:var(--white);background:var(--gray)}
.item.past{opacity:.45}
.item.flash{animation:flash 1.2s ease 2}
@keyframes flash{0%,100%{box-shadow:none}50%{box-shadow:0 0 0 4px var(--white)}}
.item .grow{flex:1;min-width:200px}
.item .tt{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.item .time{font-weight:800;color:#e5e5e5;font-variant-numeric:tabular-nums;white-space:nowrap}
.item .note{font-size:13px;color:var(--muted);margin-top:2px}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chk{position:relative;width:32px;height:32px;flex:none;cursor:pointer}
.chk input{position:absolute;opacity:0;inset:0;cursor:pointer}
.chk span{position:absolute;inset:0;border-radius:9px;border:2px solid var(--line2);background:var(--bg2);transition:.15s}
.chk input:checked+span{background:var(--white);border-color:var(--white)}
.chk input:checked+span::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#000;font-size:20px;font-weight:900}
input[type=number],input[type=text],input[type=password],input[type=date],select,textarea{background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 12px;font-size:15px;font-family:inherit;min-height:46px}
input[type=number]{width:80px}
textarea{width:100%;min-height:220px;resize:vertical;line-height:1.7}
input:focus,textarea:focus,select:focus{outline:2px solid var(--white);outline-offset:-1px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:600}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:640px){.fgrid{grid-template-columns:1fr}.item .time{font-size:14px}
#nav{position:fixed;top:auto;bottom:0;left:0;right:0;flex-wrap:nowrap;padding:8px 6px calc(8px + env(safe-area-inset-bottom))}
#nav button{flex:1 1 0;min-width:0;padding:8px 2px;font-size:12px}
main{padding-bottom:120px}
.btn{min-height:54px;font-size:17px}
.homeHello{font-size:28px}
.focusBtn{width:100%}
.grid{grid-template-columns:1fr 1fr}
}
.bar{height:12px;background:var(--gray);border-radius:999px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#525252,#fafafa);border-radius:999px;transition:width .4s}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;background:var(--gray);border:1px solid var(--line2);font-size:12px;color:var(--muted);margin-right:6px}
.qcard{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px;margin:12px 0}
.qcard .q{font-size:17px;font-weight:700;margin:8px 0}
.ansBox{margin-top:12px;padding:12px 14px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid var(--line2);display:none}
.ansBox.show{display:block}
.ansBox b{color:var(--white)}
.qtext{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ansInline{display:none}
.ansInline.show{display:block}
.opt{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:15px;cursor:pointer}
.opt:hover{border-color:var(--muted)}
.opt.sel{background:var(--white);color:#0a0a0a;border-color:var(--white);font-weight:700}
.opt.right{background:#d4d4d4;color:#0a0a0a;border-color:var(--white);font-weight:700}
.opt.right::after{content:"✓";float:right;background:#000;color:#fff;border-radius:6px;padding:0 8px;font-weight:900}
.opt.wrong{background:var(--gray);color:var(--faint);border-color:var(--border);text-decoration:line-through}
#timerOverlay{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);display:flex;align-items:center;justify-content:center;padding:20px}
.timerBox{width:100%;max-width:460px;background:var(--bg2);border:1px solid var(--line2);border-radius:20px;padding:30px 24px;text-align:center}
#timerLabel{font-size:20px;font-weight:800;margin-bottom:8px}
#timerDigits{font-size:clamp(64px,20vw,110px);font-weight:900;font-variant-numeric:tabular-nums;color:var(--white);line-height:1.1}
.timerRow{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px;margin-top:14px}
#toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;width:min(92vw,520px)}
.toast{background:var(--gray);border:1px solid var(--line2);color:var(--text);padding:12px 20px;border-radius:12px;font-size:15px;opacity:0;transform:translateY(10px);transition:.3s;box-shadow:0 8px 24px rgba(0,0,0,.5);text-align:center;max-width:100%}
.toast.show{opacity:1;transform:none}
#modalRoot:empty{display:none}
.modalMask{position:fixed;inset:0;z-index:150;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:18px}
.modal{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--line2);border-radius:20px;padding:22px}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}
.stat>div{flex:1;min-width:110px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center}
.stat b{display:block;font-size:26px;color:var(--white)}
.debtRow{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;margin:8px 0;background:var(--bg2);flex-wrap:wrap}
.debtRow.done{opacity:.45}
.debtRow .grow{flex:1;min-width:180px}
.strike{text-decoration:line-through}
.bigNum{font-size:44px;font-weight:900;color:var(--white);line-height:1.1}
.chipRow{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.chip{padding:9px 16px;border-radius:999px;border:1px solid var(--line2);background:var(--bg2);color:var(--muted);font-size:14px;font-weight:600;cursor:pointer}
.chip.on{background:var(--white);border-color:var(--white);color:#0a0a0a}
.term{display:flex;justify-content:space-between;gap:10px;padding:9px 4px;border-bottom:1px dashed var(--line2);flex-wrap:wrap}
.term b{color:#e5e5e5}
.listPlain{margin:0;padding-left:20px}
.listPlain li{margin:5px 0}
.chapter{display:flex;width:100%;align-items:center;gap:10px;padding:13px 16px;border:1px solid var(--border);border-radius:12px;background:var(--bg2);color:var(--text);font-size:16px;margin:8px 0;cursor:pointer;text-align:left}
.chapter.read{border-color:var(--white);background:rgba(255,255,255,.07)}
.chapter.read::after{content:"✓ 已读";margin-left:auto;color:var(--white);font-weight:700;flex:none}
.chapter:not(.read)::after{content:"未读";margin-left:auto;color:var(--faint);font-size:13px;flex:none}
.warnBox{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gray);border:1px solid var(--line2)}
.warnBox b{color:var(--white)}
.center{text-align:center}
.homeHello{font-size:34px;font-weight:900;margin:0}
.focusCard{border-left:5px solid var(--white)}
.focusBtn{padding:16px 30px;font-size:18px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;margin-top:6px}
.gridBtn{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px 12px;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;color:var(--text);font-size:15px;font-weight:600}
.gridBtn:hover{border-color:var(--white)}
.gridBtn .glyph{font-size:26px;color:var(--white);font-weight:900;line-height:1}
.debtBar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--gray);border:1px solid var(--line2);border-radius:14px;padding:14px 18px;margin:12px 0;cursor:pointer;flex-wrap:wrap}
.debtBar b{color:var(--white)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main>
<section class="sec" id="sec-home"></section>
<section class="sec" id="sec-today"></section>
<section class="sec" id="sec-sat"></section>
<section class="sec" id="sec-checkin"></section>
<section class="sec" id="sec-debt"></section>
<section class="sec" id="sec-bank"></section>
<section class="sec" id="sec-ai"></section>
<section class="sec" id="sec-read"></section>
<section class="sec" id="sec-bus"></section>
<section class="sec" id="sec-tools"></section>
<section class="sec" id="sec-materials"></section>
</main>
<div id="timerOverlay" class="hidden">
  <div class="timerBox" id="timerRun">
    <div id="timerLabel"></div>
    <div id="timerDigits">25:00</div>
    <div class="timerRow">
      <button class="btn btn-ghost" id="timerPause">暂停</button>
      <button class="btn btn-red" id="timerCancel">取消</button>
    </div>
    <div class="hint">倒计时结束会响铃并自动跳到下一项</div>
  </div>
  <div class="timerBox hidden" id="timerDone">
    <div style="font-size:44px;font-weight:900;color:var(--white)">时间到</div>
    <div id="doneText" style="font-size:19px;font-weight:800;margin:10px 0 4px"></div>
    <div id="doneNext" class="muted"></div>
    <div class="timerRow">
      <button class="btn btn-green" id="doneNextBtn">开始下一项</button>
      <button class="btn btn-ghost" id="doneClose">完成，关闭</button>
    </div>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toasts"></div>
<script>
"use strict";
/* ================= 工具函数 ================= */
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const store={
  get(k,d){try{const v=localStorage.getItem('lsa_'+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem('lsa_'+k,JSON.stringify(v));}catch(e){}}
};
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function pad(n){return String(n).padStart(2,'0');}
function isoOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
function todayISO(){return isoOf(new Date());}
function minOf(t){const a=t.split(':');return (+a[0])*60+(+a[1]);}
function timeOf(m){m=((Math.round(m)%1440)+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);}
function shiftTime(t,delta){return timeOf(minOf(t)+delta);}
function isoWeek(d){const t=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));const dn=t.getUTCDay()||7;t.setUTCDate(t.getUTCDate()+4-dn);const y0=new Date(Date.UTC(t.getUTCFullYear(),0,1));return Math.ceil((((t-y0)/86400000)+1)/7);}
function toast(msg,ms){ms=ms||3200;const box=$('#toasts');const t=document.createElement('div');t.className='toast';t.textContent=msg;box.appendChild(t);requestAnimationFrame(()=>t.classList.add('show'));setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),400);},ms);}
function openModal(html){const root=$('#modalRoot');root.innerHTML='<div class="modalMask"><div class="modal">'+html+'</div></div>';const mask=root.firstElementChild;mask.addEventListener('click',e=>{if(e.target===mask)closeModal();});return mask.querySelector('.modal');}
function closeModal(){$('#modalRoot').innerHTML='';}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ================= 提示音（Web Audio API） ================= */
let actx=null;
function ensureAudio(){try{if(!actx)actx=new (window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume();}catch(e){}}
document.addEventListener('pointerdown',ensureAudio);
function beep(f,t0,dur){const o=actx.createOscillator(),g=actx.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.0001,t0);g.gain.exponentialRampToValueAtTime(0.45,t0+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);o.connect(g);g.connect(actx.destination);o.start(t0);o.stop(t0+dur+0.05);}
function playAlarm(){ensureAudio();if(!actx)return;const t0=actx.currentTime+0.05;for(let i=0;i<3;i++){beep(880,t0+i*0.7,0.5);beep(1174.66,t0+i*0.7+0.16,0.34);}}

/* ================= 倒计时器 ================= */
const TM={endAt:0,label:'',key:null,left:0,paused:false,iv:null};
let pendingNext=null;
function startTimer(min,label,key){
  ensureAudio();
  if(TM.iv)clearInterval(TM.iv);
  TM.endAt=Date.now()+min*60000;TM.label=label;TM.key=key;TM.paused=false;TM.left=min*60000;
  store.set('timer',{endAt:TM.endAt,label:label,key:key});
  $('#timerRun').classList.remove('hidden');$('#timerDone').classList.add('hidden');
  $('#timerOverlay').classList.remove('hidden');
  $('#timerLabel').textContent=label;$('#timerPause').textContent='暂停';
  tick();TM.iv=setInterval(tick,500);
}
function tick(){
  const left=TM.paused?TM.left:(TM.endAt-Date.now());
  if(left<=0){finishTimer();return;}
  TM.left=left;const s=Math.ceil(left/1000);
  $('#timerDigits').textContent=pad(Math.floor(s/60))+':'+pad(s%60);
  document.title='['+$('#timerDigits').textContent+'] '+TM.label+' · 学习助手';
}
function pauseTimer(){
  if(!TM.paused){TM.paused=true;TM.left=TM.endAt-Date.now();$('#timerPause').textContent='继续';}
  else{TM.paused=false;TM.endAt=Date.now()+TM.left;store.set('timer',{endAt:TM.endAt,label:TM.label,key:TM.key});$('#timerPause').textContent='暂停';}
}
function cancelTimer(){
  if(TM.iv)clearInterval(TM.iv);
  Object.assign(TM,{endAt:0,iv:null,paused:false,key:null});
  store.set('timer',null);$('#timerOverlay').classList.add('hidden');document.title='学习助手';
}
function hideTimerDone(){
  $('#timerOverlay').classList.add('hidden');document.title='学习助手';
  if(pendingNext){const el=document.getElementById('item-'+pendingNext.key);
    if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2600);toast('下一项：'+pendingNext.label+'，加油！');}
    pendingNext=null;}
}
function finishTimer(){
  if(TM.iv)clearInterval(TM.iv);
  store.set('timer',null);playAlarm();
  const doneKey=TM.key,label=TM.label;
  Object.assign(TM,{endAt:0,iv:null,paused:false,key:null});
  if(doneKey)markDone(doneKey);
  document.title='学习助手';
  $('#timerDigits').textContent='00:00';
  $('#timerRun').classList.add('hidden');$('#timerDone').classList.remove('hidden');
  $('#doneText').textContent='已完成：'+label;
  const idx=currentItems.findIndex(x=>x.key===doneKey);
  const next=idx>=0?currentItems[idx+1]:null;
  if(next&&!next.endOnly){pendingNext=next;$('#doneNext').textContent='下一项：'+next.t+' '+next.title;$('#doneNextBtn').disabled=false;}
  else{pendingNext=null;$('#doneNext').textContent=next?('之后：'+next.title):'今天的日程已全部完成！';$('#doneNextBtn').disabled=true;}
  if(RENDERERS[currentTab])RENDERERS[currentTab]();
}
function restoreTimer(){
  const t=store.get('timer',null);
  if(t&&t.endAt>Date.now()){
    TM.endAt=t.endAt;TM.label=t.label||'';TM.key=t.key||null;TM.paused=false;
    $('#timerRun').classList.remove('hidden');$('#timerDone').classList.add('hidden');
    $('#timerOverlay').classList.remove('hidden');$('#timerLabel').textContent=TM.label;$('#timerPause').textContent='暂停';
    tick();TM.iv=setInterval(tick,500);
  }else if(t){store.set('timer',null);}
}
$('#timerPause').addEventListener('click',pauseTimer);
$('#timerCancel').addEventListener('click',()=>{cancelTimer();toast('已取消计时');});
$('#timerDone').addEventListener('click',e=>{e.stopPropagation();});
$('#timerOverlay').addEventListener('click',e=>{if(e.target.id==='timerOverlay'&&!$('#timerDone').classList.contains('hidden'))hideTimerDone();});
$('#doneClose').addEventListener('click',hideTimerDone);
$('#doneNextBtn').addEventListener('click',()=>{if(pendingNext){const n=pendingNext;hideTimerDone();startTimer(n.min||25,n.title,n.key);}});

/* ================= 打卡存储 ================= */
function getDone(){const all=store.get('done',{});return all[todayISO()]||{};}
function markDone(key){
  const all=store.get('done',{});const d=all[todayISO()]||{};
  d[key]=true;all[todayISO()]=d;store.set('done',all);
}
function itemTitle(key){const it=currentItems.find(x=>x.key===key);return it?it.title:key;}

/* ================= 日程数据 ================= */
const DN=['周日','周一','周二','周三','周四','周五','周六'];
const ROTATION={
  1:['文学（文本细读）','数学（错题+手感）'],
  2:['经济 office 复盘','经济（细节错题）'],
  3:['文学复盘（轻）','语言（语法点+积累）'],
  4:['经济（FRQ专项）','历史（TEA练SAQ）'],
  5:['语言（错题+词汇）','生物（错题+预习）']
};
const OFFICE={2:['经济','经济（细节错题）'],3:['文学','语言（语法点+积累）']};
function normalItems(day,hwMin){
  const b=ROTATION[day];const hwStart=17*60+50;const shift=hwMin-60;
  const arr=[
    {t:'07:20-07:40',title:'记忆卡片',min:20},
    {t:'16:10-16:50',title:'校车学习',min:40},
    {t:'17:30-17:50',title:'晚饭',min:20},
    {t:timeOf(hwStart)+'-'+timeOf(hwStart+hwMin),title:'学校作业',min:hwMin,note:'时长可在上方调整，改后后续时段自动顺延'},
    {t:shiftTime('18:50',shift)+'-'+shiftTime('19:20',shift),title:'休息',min:30},
    {t:shiftTime('19:20',shift)+'-'+shiftTime('19:30',shift),title:'洗漱 + 手机放客厅',min:10},
    {t:shiftTime('19:30',shift)+'-'+shiftTime('20:30',shift),title:'Block1 · '+b[0],min:60},

const CHECK_TASKS=['记忆卡片（早 7:20）','校车学习（16:10）','学校作业按时完成','晚间 Block1 / Office 复盘','晚间 Block2 / 第二科目','睡前阅读（21:30）','手机 19:30 前放客厅'];
function getCheckins(){return store.get('checkins',{});}
function checkedCount(dateISO){const c=getCheckins();return Object.keys(c[dateISO]||{}).length;}
function streakDays(){
  let s=0;const d=new Date();
  if(checkedCount(isoOf(d))===0)d.setDate(d.getDate()-1);
  while(checkedCount(isoOf(d))>0){s++;d.setDate(d.getDate()-1);}
  return s;
}
function weekPct(){
  const now=new Date();const dow=now.getDay()||7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow+1);
  let tot=0;
  for(let i=0;i<7;i++){const d=new Date(mon);d.setDate(mon.getDate()+i);tot+=checkedCount(isoOf(d));}
  return Math.round(tot/(CHECK_TASKS.length*7)*100);
}
function renderCheckin(){
  const el=$('#sec-checkin');
  const c=getCheckins();const today=c[todayISO()]||{};
  const taskRows=CHECK_TASKS.map(function(t,i){
    const on=today[i]?'checked':'';
    return '<div class="debtRow"><label class="chk"><input type="checkbox" class="taskChk" data-idx="'+i+'" '+on+'><span></span></label><div class="grow" style="font-size:16px">'+esc(t)+'</div></div>';
  }).join('');
  const now=new Date();const dow=now.getDay()||7;
  const mon=new Date(now);mon.setDate(now.getDate()-dow+1);
  let weekTotal=0;let rows='';
  for(let i=0;i<7;i++){
    const d=new Date(mon);d.setDate(mon.getDate()+i);
    const iso=isoOf(d);const n=checkedCount(iso);weekTotal+=n;
    const p=Math.round(n/CHECK_TASKS.length*100);
    rows+='<div style="display:flex;align-items:center;gap:10px;margin:8px 0">'
      +'<span style="min-width:96px;font-weight:'+(iso===todayISO()?'800':'400')+';color:'+(iso===todayISO()?'var(--white)':'inherit')+'">'+DN[(d.getDay())]+' '+iso.slice(5)+'</span>'
      +'<div class="bar" style="flex:1"><i style="width:'+p+'%"></i></div>'
      +'<span class="muted" style="min-width:44px;text-align:right">'+n+'/'+CHECK_TASKS.length+'</span></div>';
  }
  const wPct=Math.round(weekTotal/(CHECK_TASKS.length*7)*100);
  el.innerHTML='<div class="card row"><div><h2>每日打卡</h2><div class="muted">'+todayISO()+' · 每天至少完成一项即算打卡成功</div></div>'
    +'<div class="center"><div class="bigNum" id="streakNum">'+streakDays()+'</div><div class="muted">连续坚持（天）</div></div></div>'
    +'<div class="card">'+taskRows+'</div>'
    +'<div class="card"><h3>本周完成率：'+wPct+'%</h3>'+rows+'</div>';
}

function allQuestions(){
  const arr=[];
  Object.keys(BANK).forEach(subj=>BANK[subj].forEach(x=>arr.push({subject:subj,q:x.q,a:x.a,exp:x.exp||''})));
  store.get('customQ',[]).forEach(x=>arr.push({subject:x.subject,q:x.q,a:x.a,exp:x.exp||'',custom:true}));
  return arr;
}
function allSubjects(){
  const s=[];allQuestions().forEach(q=>{if(!s.includes(q.subject))s.push(q.subject);});return s;
}

    +'<div class="card"><div class="chipRow">'+modes.map(m=>'<div class="chip modeChip'+(bankMode===m[0]?' on':'')+'" data-mode="'+m[0]+'">'+m[1]+'</div>').join('')+'</div>'

function startQuiz(){
  const chosen=$$('#quizSubs .subjChip.on').map(c=>c.dataset.subj);
  let pool=allQuestions().filter(q=>chosen.includes(q.subject));
  if(!pool.length){toast('请先至少选择一个科目');return;}
  for(let i=pool.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=pool[i];pool[i]=pool[j];pool[j]=t;}
  quiz.list=pool.slice(0,5);quiz.i=0;quiz.right=0;quiz.bySubj={};
  renderQuizStep();
}
function renderQuizStep(){
  const host=$('#quizHost');
  if(quiz.i>=quiz.list.length){renderQuizResult();return;}
  const q=quiz.list[quiz.i];
  host.innerHTML='<div class="qcard"><div class="muted">第 '+(quiz.i+1)+' / '+quiz.list.length+' 题</div>'
    +'<span class="tag">'+esc(q.subject)+'</span>'
    +'<div class="q">'+esc(q.q)+'</div>'
    +'<div class="btn-row"><button class="btn btn-yellow" id="quizReveal">显示答案</button></div>'
    +'<div class="ansBox" id="quizAns"><div><b>答案：</b>'+esc(q.a)+'</div>'+(q.exp?'<div class="muted" style="margin-top:6px">解析：'+esc(q.exp)+'</div>':'')
    +'<div class="btn-row"><button class="btn btn-green selfMark" data-v="1">我答对了 ✓</button><button class="btn btn-ghost selfMark" data-v="0">还不熟 ✗</button></div></div></div>';
  $('#quizReveal').addEventListener('click',function(){$('#quizAns').classList.add('show');this.remove();});
  host.querySelectorAll('.selfMark').forEach(b=>b.addEventListener('click',function(){
    const ok=this.dataset.v==='1';
    const s=q.subject;quiz.bySubj[s]=quiz.bySubj[s]||{r:0,t:0};quiz.bySubj[s].t++;if(ok){quiz.right++;quiz.bySubj[s].r++;}
    quiz.i++;renderQuizStep();
  }));
}
function renderQuizResult(){
  const n=quiz.list.length;const pct=Math.round(quiz.right/n*100);
  let warns='';
  Object.keys(quiz.bySubj).forEach(s=>{
    const v=quiz.bySubj[s];const p=Math.round(v.r/v.t*100);
    if(v.t>0&&p<80)warns+='<div class="warnBox">⚠ <b>'+esc(s)+'</b> 正确率 '+p+'%（'+v.r+'/'+v.t+'），<b>下周加一档</b>：给这门课多排一段专项时间。</div>';
  });
  $('#quizHost').innerHTML='<div class="qcard center"><h2>抽查结果</h2>'
    +'<div class="stat"><div><b>'+quiz.right+'/'+n+'</b><span class="muted">答对</span></div><div><b>'+pct+'%</b><span class="muted">正确率</span></div></div>'
    +(warns||'<p class="muted">全部科目正确率 ≥ 80%，保持！</p>')
    +'<div class="btn-row" style="justify-content:center"><button class="btn" id="quizAgain">再来一轮</button><button class="btn btn-ghost" id="quizBack">返回选择</button></div></div>';
  $('#quizAgain').addEventListener('click',startQuiz);
  $('#quizBack').addEventListener('click',()=>{renderBank();});
}

const aiQ={list:[],i:0,right:0,sel:-1,locked:false};
function renderAI(){

    +'<button class="btn" id="aiStart" '+(hasKey?'':'disabled')+'>'+(hasKey?'开始 AI 抽查（5 道选择题）':'未配置 API Key · 静态题库可用')+'</button>'
    +'<div id="aiHost" style="margin-top:14px"></div></div>';

function aiPrompt(){
  return 'You are an AP course teacher. Based on the student\'s current units, create 5 multiple-choice questions in ENGLISH (4 options each, single answer), give the correct answer index and a bilingual explanation in the exact format "English sentence / 中文句子". Units: AP World History Unit 3 Trade (1200-1450: Silk Road, Indian Ocean trade, Trans-Saharan trade); Biology Unit 2 cell membrane and transport (simple diffusion, osmosis, facilitated diffusion, active transport, Na/K pump); Math functions (evaluation, domain, slope); Economics Unit 3 Cost and Profit (TC, ATC, AVC, AFC, MC, MP relationships); English close reading of "Let Them Eat Dog" (central claim, satire, appeals); Literature "Of Mice and Men" chapters 1-2 (theme, imagery, foreshadowing). Questions should test understanding rather than memorization, at medium difficulty. Output STRICTLY a JSON array in this format: [{"subject":"...","question":"...","options":["..."],"answer":0,"explanation":"English / 中文"}] where answer is the 0-based index of the correct option.';
}
async function aiGenerate(){
  const s=store.get('settings',{});
  const base=(s.apiBase||'https://api.moonshot.cn/v1').replace(/\/+$/,'');
  const host=$('#aiHost');
  host.innerHTML='<div class="qcard center"><div class="muted">正在出题，请稍候…</div></div>';
  try{
    const resp=await fetch(base+'/chat/completions',{method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.apiKey},
      body:JSON.stringify({model:s.model||'kimi-k2-0905-preview',
        messages:[{role:'system',content:'You are a teacher generating questions. Output only a valid JSON array, nothing else.'},{role:'user',content:aiPrompt()}],
        temperature:0.7})});
    if(!resp.ok)throw new Error('HTTP '+resp.status);
    const data=await resp.json();
    const txt=data.choices&&data.choices[0]&&data.choices[0].message?data.choices[0].message.content:'';
    const m=txt.match(/\[[\s\S]*\]/);
    if(!m)throw new Error('返回内容无法解析为题目');
    const qs=JSON.parse(m[0]);
    if(!Array.isArray(qs)||!qs.length)throw new Error('没有拿到题目');
    aiQ.list=qs.slice(0,5).map(function(x){return{subject:String(x.subject||'综合'),question:String(x.question||''),options:(x.options||[]).map(String),answer:+x.answer||0,explanation:String(x.explanation||'')};});
    aiQ.i=0;aiQ.right=0;renderAIStep();
  }catch(err){
    host.innerHTML='<div class="qcard"><div class="warnBox">出题失败：'+esc(err.message)+'。请检查 API Key、网络或模型名；静态题库不受影响，可正常使用。</div>'
    +'<div class="btn-row"><button class="btn btn-ghost" id="aiRetry">重试</button></div></div>';
    const r=$('#aiRetry');if(r)r.addEventListener('click',aiGenerate);
  }
}
function renderAIStep(){
  const host=$('#aiHost');
  if(aiQ.i>=aiQ.list.length){
    const n=aiQ.list.length;const pct=Math.round(aiQ.right/n*100);
    host.innerHTML='<div class="qcard center"><h2>AI 抽查结果</h2>'
      +'<div class="stat"><div><b>'+aiQ.right+'/'+n+'</b><span class="muted">答对</span></div><div><b>'+pct+'%</b><span class="muted">正确率</span></div></div>'
      +'<p class="muted">AI 生成，存疑请找老师确认。</p>'
      +'<div class="btn-row" style="justify-content:center"><button class="btn" id="aiAgain">再来一轮</button></div></div>';
    $('#aiAgain').addEventListener('click',aiGenerate);
    return;
  }
  const q=aiQ.list[aiQ.i];aiQ.sel=-1;aiQ.locked=false;
  host.innerHTML='<div class="qcard"><div class="muted">第 '+(aiQ.i+1)+' / '+aiQ.list.length+' 题 · AI 生成，存疑请找老师确认</div>'
    +'<span class="tag">'+esc(q.subject)+'</span>'
    +'<div class="q">'+esc(q.question)+'</div>'
    +q.options.map((o,j)=>'<button class="opt aiOpt" data-j="'+j+'">'+String.fromCharCode(65+j)+'. '+esc(o)+'</button>').join('')
    +'<div id="aiExp"></div>'
    +'<div class="btn-row"><button class="btn" id="aiNext" disabled>下一题</button></div></div>';
  host.querySelectorAll('.aiOpt').forEach(b=>b.addEventListener('click',function(){
    if(aiQ.locked)return;
    host.querySelectorAll('.aiOpt').forEach(x=>x.classList.remove('sel'));
    this.classList.add('sel');aiQ.sel=+this.dataset.j;$('#aiNext').disabled=false;
  }));
  $('#aiNext').addEventListener('click',function(){
    if(aiQ.sel<0)return;
    if(!aiQ.locked){
      aiQ.locked=true;
      const q2=aiQ.list[aiQ.i];
      host.querySelectorAll('.aiOpt').forEach(x=>{const j=+x.dataset.j;if(j===q2.answer)x.classList.add('right');else if(j===aiQ.sel)x.classList.add('wrong');});
      if(aiQ.sel===q2.answer)aiQ.right++;

      this.textContent=(aiQ.i===aiQ.list.length-1)?'查看结果':'下一题';
    }else{aiQ.i++;renderAIStep();}
  });
}

function downloadICS(){

  const stamp=fmt(new Date());
  const nextSaturday=()=>{const d=new Date();d.setHours(8,0,0,0);d.setDate(d.getDate()+((6-d.getDay()+7)%7));return d;};
  const nextMonthly15=()=>{const n=new Date();const d=new Date(n.getFullYear(),n.getMonth(),15,20,0,0);if(d.getTime()<=n.getTime())d.setMonth(d.getMonth()+1);return d;};
  const ev=(uid,title,start,rule)=>{
    return ['BEGIN:VEVENT','UID:'+uid+'@xuexizhushou','DTSTAMP:'+stamp,'DTSTART:'+fmt(start),'SUMMARY:'+title,'RRULE:'+rule,
      'BEGIN:VALARM','TRIGGER:-PT0M','ACTION:DISPLAY','DESCRIPTION:'+title,'END:VALARM','END:VEVENT'].join('\r\n');
  };
  const daily=(uid,title,h,m)=>{const s=new Date();s.setHours(h,m,0,0);return ev(uid,title,s,'FREQ=DAILY');};
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//XueXiZhuShou//StudyAssistant//CN','CALSCALE:GREGORIAN',
    daily('r1730','学习提醒：晚饭 / 准备开始晚间学习',17,30),

    ev('m15','月度回顾：汇总成绩与作息',nextMonthly15(),'FREQ=MONTHLY;BYMONTHDAY=15'),
    'END:VCALENDAR'];
  const blob=new Blob([lines.join('\r\n')],{type:'text/calendar;charset=utf-8'});

/* ---------- 数据导出 / 导入 ---------- */
function exportData(){
  const data={};
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k.indexOf('lsa_')!==0)continue;
    try{data[k]=JSON.parse(localStorage.getItem(k));}
    catch(e){data[k]=localStorage.getItem(k);}
  }
  const d=new Date();
  const name='学习助手_备份_'+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'.json';
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},800);
  toast('已导出 '+Object.keys(data).length+' 项数据到 '+name);
}
function importData(input){
  const file=input.files&&input.files[0];
  input.value='';
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(){
    try{
      const data=JSON.parse(reader.result);
      if(!data||typeof data!=='object'||Array.isArray(data))throw new Error('文件内容不是有效的数据对象');
      const keys=Object.keys(data).filter(k=>k.indexOf('lsa_')===0);
      if(!keys.length)throw new Error('文件中没有可识别的数据（缺少 lsa_ 前缀键）');
      if(!confirm('导入将覆盖本机现有数据，确定吗？'))return;
      keys.forEach(k=>{try{localStorage.setItem(k,JSON.stringify(data[k]));}catch(e){}});
      toast('导入成功，即将刷新页面…');
      setTimeout(()=>location.reload(),600);
    }catch(err){
      toast('导入失败：'+err.message);
    }
  };
  reader.onerror=function(){toast('读取文件失败，请重试');};
  reader.readAsText(file);
}

    return;
  }
  const mc=e.target.closest('.modeChip');
  if(mc){bankMode=mc.dataset.mode;renderBank();return;}
  const sc=e.target.closest('.subjChip');
  if(sc){sc.classList.toggle('on');return;}
  const ab=e.target.closest('.ansBtn');
  if(ab){
    const box=ab.closest('.qrow').querySelector('.ansInline');
    box.classList.toggle('show');
    ab.textContent=box.classList.contains('show')?'收起':'答';
    return;
  }
  if(e.target.closest('#startQuizBtn')){startQuiz();return;}
  if(e.target.closest('#doImportBtn')){
    const txt=($('#importBox').value||'').trim();
    if(!txt){toast('请粘贴题目文本');return;}
    const lines=txt.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    const arr=store.get('customQ',[]);let n=0;
    for(const line of lines){const p=line.split('|').map(s=>s.trim());if(p.length<3||!p[0]||!p[1]||!p[2])continue;arr.push({subject:p[0],q:p[1],a:p[2],exp:p[3]||''});n++;}
    if(!n){toast('没有识别到有效题目，格式应为：科目 | 题目 | 答案 | 解析');return;}
    store.set('customQ',arr);toast('已导入 '+n+' 题');renderBank();return;
  }
  const dc=e.target.closest('.delCustomBtn');
  if(dc){const arr=store.get('customQ',[]);arr.splice(+dc.dataset.i,1);store.set('customQ',arr);renderBank();return;}
  if(e.target.closest('#aiSave')){
    const s=store.get('settings',{});
    s.apiBase=$('#aiBase').value.trim()||'https://api.moonshot.cn/v1';
    s.apiKey=$('#aiKey').value.trim();
    s.model=$('#aiModel').value.trim()||'kimi-k2-0905-preview';
    store.set('settings',s);toast('AI 设置已保存');renderAI();return;
  }
  if(e.target.closest('#aiStart')){aiGenerate();return;}
  const ch=e.target.closest('.chapter');
  if(ch){
    const r=getReading();const c=r.chapters[+ch.dataset.i];
    c.read=!c.read;store.set('reading',r);renderRead();
    toast(c.read?'已标记读完：'+c.t:'已取消已读：'+c.t);return;
  }
  if(e.target.closest('#readReplace')){
    const v=($('#replaceBox').value||'').trim();
    const lines=v.split(/\n+/).map(l=>l.trim()).filter(Boolean);
    if(!lines.length){toast('请粘贴至少一个章节标题（一行一个）');return;}
    const old=getReading();
    if(!confirm('确定用新书目替换《'+old.title+'》？已读进度将重置。'))return;
    store.set('reading',{title:lines[0].length>20?lines[0].slice(0,20)+'…':lines[0],chapters:lines.map(t=>({t:t,read:false}))});
    toast('书目已替换，共 '+lines.length+' 个章节');renderRead();return;
  }
  if(e.target.closest('#debtAdd')){
    const content=$('#debtContent').value.trim();
    if(!content){toast('请填写欠了什么');return;}
    const arr=store.get('debts',[]);
    arr.push({id:Date.now(),subject:$('#debtSubject').value,content:content,date:$('#debtDate').value||todayISO(),done:false});
    store.set('debts',arr);toast('已记下这笔账，周六记得补');renderDebt();return;
  }
  const dd=e.target.closest('.debtDone');
  if(dd){const arr=store.get('debts',[]);const d=arr.find(x=>x.id===+dd.dataset.id);if(d){d.done=true;store.set('debts',arr);renderDebt();toast('很好，这笔账清了');}return;}
  const dl=e.target.closest('.debtDel');
  if(dl){
    if(!confirm('确定删除这条欠账记录？'))return;
    store.set('debts',store.get('debts',[]).filter(x=>x.id!==+dl.dataset.id));renderDebt();return;
  }
  if(e.target.closest('#exportIcs')){downloadICS();return;}
  if(e.target.closest('#exportData')){exportData();return;}
  if(e.target.closest('#importDataBtn')){const f=$('#importFile');if(f)f.click();return;}
  if(e.target.closest('#monthlyOpen')){openMonthlyModal();return;}
  if(e.target.closest('#monthlySave')){saveMonthly();return;}
  if(e.target.closest('#monthlyCancel')){closeModal();return;}
  if(e.target.closest('#matEditBtn')){matEdit=true;renderMaterials();return;}
  if(e.target.closest('#matDoneBtn')){const b=$('#matBox');if(b)store.set('materials',b.value);matEdit=false;renderMaterials();toast('已返回阅读模式');return;}
  if(e.target.closest('#matSave')){store.set('materials',$('#matBox').value);toast('材料已保存');return;}
  if(e.target.closest('#matReset')){
    if(!confirm('恢复为默认预置内容？当前修改会丢失。'))return;
    store.set('materials',MATERIALS_DEFAULT);renderMaterials();toast('已恢复默认内容');return;
  }
});
document.addEventListener('change',function(e){
  if(e.target.id==='importFile'){importData(e.target);return;}
  const dc=e.target.closest('.doneChk');
  if(dc){
    const all=store.get('done',{});const d=all[todayISO()]||{};
    if(dc.checked)d[dc.dataset.key]=true;else delete d[dc.dataset.key];
    all[todayISO()]=d;store.set('done',all);
    if(dc.checked)toast('已打卡：'+itemTitle(dc.dataset.key));
    return;
  }
  const tc=e.target.closest('.taskChk');
  if(tc){
    const all=getCheckins();const d=all[todayISO()]||{};
    if(tc.checked)d[tc.dataset.idx]=true;else delete d[tc.dataset.idx];
    all[todayISO()]=d;store.set('checkins',all);renderCheckin();
    return;
  }
  if(e.target.id==='hwInput'){
    const v=Math.min(240,Math.max(10,parseInt(e.target.value)||60));
    const s=store.get('settings',{hw:{normal:60,office:60}});
    if(!s.hw)s.hw={normal:60,office:60};
    const day=new Date().getDay();
    if(day===2||day===3)s.hw.office=v;else s.hw.normal=v;
    store.set('settings',s);renderToday();
    toast('作业时长已调整为 '+v+' 分钟，后续时段已顺延');
    return;
  }
  if(e.target.id==='bankSubjectSel'){
    bankSubject=e.target.value;renderBank();
    const sel=$('#bankSubjectSel');if(sel)sel.value=bankSubject;
    return;
  }
});

/* ================= 启动 ================= */
buildNav();
const initTab=(location.hash||'#sec-home').slice(1);
switchTab(document.getElementById(initTab)?initTab:'sec-home',false);
restoreTimer();
checkMonthlyPrompt();
</script>
</body>
</html>
